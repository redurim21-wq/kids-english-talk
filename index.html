<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>아이와 영어로 말해요 (NGSL 721)</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아이영어톡" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 pb-16">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 px-4 py-3">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💬</span>
        <div>
          <h1 class="font-bold text-base text-slate-900 leading-tight">아이영어톡</h1>
          <p class="text-[11px] text-indigo-600 font-medium">NGSL 721 · 초등 기초 회화</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="shareApiKey()" class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1.5 rounded-lg active:scale-95 transition">
          🔗 배우자 공유
        </button>
        <button onclick="toggleModal(true)" class="text-xs bg-slate-100 text-slate-700 font-semibold px-2.5 py-1.5 rounded-lg active:scale-95 transition">
          ⚙️ 키 설정
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">

    <!-- 입력 카드 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
      <div class="flex items-center justify-between">
        <label for="situationInput" class="text-xs font-bold text-slate-500">아이에게 어떤 말을 하고 싶나요?</label>
        <button id="micBtn" onclick="startVoiceInput()" class="text-xs flex items-center gap-1 text-indigo-600 font-semibold bg-indigo-50 px-2.5 py-1 rounded-full active:scale-95">
          <span>🎙️</span> <span id="micLabel">말로 입력</span>
        </button>
      </div>

      <textarea id="situationInput" rows="2"
        placeholder="예: 유튜브 20분만 보고 영어 숙제 먼저 하자"
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>

      <!-- 퀵 상황 버튼 -->
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
        <button onclick="quickFill('유튜브 20분만 보고 영어 숙제 먼저 하자')" class="shrink-0 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full">📺 유튜브 약속</button>
        <button onclick="quickFill('장난감 정리하고 손 씻고 밥 먹자')" class="shrink-0 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full">🍽️ 식사·정리</button>
        <button onclick="quickFill('이제 양치하고 잘 시간이야. 책 한 권만 읽을까?')" class="shrink-0 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full">🌙 양치·취침</button>
        <button onclick="quickFill('오늘 학교에서 뭐가 제일 재미있었어?')" class="shrink-0 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full">🎒 하교 후 대화</button>
      </div>

      <button id="generateBtn" onclick="generateExpressions()"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-sm active:scale-[0.99] transition flex items-center justify-center gap-2 text-sm">
        <span>✨ 영어 표현 & 아이 답변 추천받기</span>
      </button>
    </section>

    <!-- 로딩 표시 -->
    <div id="loadingBox" class="hidden py-10 text-center space-y-2">
      <div class="inline-block w-7 h-7 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="text-xs text-slate-500 font-medium">아이 눈높이에 맞는 쉬운 영어를 고르고 있어요...</p>
    </div>

    <!-- 에러 메시지 -->
    <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl p-3.5 leading-relaxed"></div>

    <!-- 결과 영역 -->
    <div id="resultArea" class="hidden space-y-5">

      <!-- 상황 요약 -->
      <div class="bg-indigo-50/70 border border-indigo-100 rounded-xl px-3.5 py-2.5 text-xs text-indigo-900 font-medium">
        📌 <span id="situationSummary"></span>
      </div>

      <!-- 1. 부모 표현 3가지 -->
      <section class="space-y-2.5">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
          <span>🗣️</span> 이렇게 말해 보세요 (3가지 톤)
        </h2>
        <div id="parentCards" class="space-y-2.5"></div>
      </section>

      <!-- 2. 핵심 단어 (NGSL 721 표시) -->
      <section class="bg-white rounded-2xl border border-slate-200 p-4 space-y-2.5">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">📚 핵심 어휘</h2>
          <span class="text-[11px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full font-semibold">NGSL 721 포함 표시</span>
        </div>
        <div id="wordChips" class="flex flex-wrap gap-2"></div>
      </section>

      <!-- 3. 아이의 예상 답변 3가지 -->
      <section class="space-y-2.5">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
          <span>🧒</span> 아이는 이렇게 대답할 수 있어요
        </h2>
        <div id="childCards" class="space-y-3"></div>
      </section>

    </div>
  </main>

  <!-- API 키 설정 모달 -->
  <div id="apiModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-base text-slate-900">🔑 Gemini API 키 설정</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>
      <p class="text-xs text-slate-600 leading-relaxed">
        Google AI Studio에서 발급받은 무료 API 키를 입력해 주세요. 키는 현재 스마트폰 브라우저에만 안전하게 저장됩니다.
      </p>
      <input id="apiKeyInput" type="password" placeholder="AIzaSy..."
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div class="flex gap-2">
        <button onclick="saveApiKey()" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">저장하기</button>
        <button onclick="toggleModal(false)" class="px-4 bg-slate-100 text-slate-700 font-semibold py-2.5 rounded-xl text-sm">닫기</button>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg"></div>

  <script>
    const STORAGE_KEY = 'kids_english_gemini_api_key';

    const SYSTEM_INSTRUCTION = `You are a warm, practical bilingual parenting coach helping Korean parents speak natural, easy English with their 7-to-8-year-old child (early elementary level).

When the user provides a situation or Korean phrase they want to say to their child, generate practical English expressions for the parent and 3 likely responses from the child.

[Strict Vocabulary & Grammar Rules]
1. Core Vocabulary: Primarily use words from the NGSL-Spoken (New General Service List - Spoken) top 721 high-frequency words and basic early-elementary concrete nouns/verbs (e.g., toys, snack, brush teeth, wash hands, homework, YouTube, dinosaur, block).
2. Simplicity: Keep sentences short (4 to 10 words) using simple structures (e.g., "Let's...", "Can you...", "Time to...", "I want to...", "Do you like...").
3. Exclusions: Strictly avoid complex idioms, phrasal verbs with abstract meanings, SAT-level vocabulary, or stiff textbook translations.
4. Natural Tone: Sound like a real, loving parent speaking to a young child in daily life.

[Output Content Requirements]
1. parent_expressions (3 variations):
   - "다정한 톤": Warm, encouraging, and soft tone.
   - "짧고 명확한 톤": Quick, clear, and easy for a child to catch immediately.
   - "재미있는 톤": Fun or engaging tone that motivates the child.
2. key_words (3 to 5 words):
   - Extract the most useful words from your generated sentences.
   - Indicate whether each word belongs to the NGSL 721 core list (true/false) and provide its Korean meaning in context.
3. child_responses (3 scenarios):
   - "긍정적 반응": When the child agrees or responds happily.
   - "망설임·협상": When the child hesitates, negotiates, or says no.
   - "엉뚱·호기심": A playful, silly, or question-based reaction typical of a young kid.
   - For each child response, include a short, natural 1-sentence follow-up reply ("parent_reply_en" and "parent_reply_ko") the parent can say next.

Always respond strictly in valid JSON matching the requested schema. All Korean explanations and translations must be natural and concise.`;

    const RESPONSE_SCHEMA = {
      type: "OBJECT",
      properties: {
        situation_summary: { type: "STRING" },
        parent_expressions: {
          type: "ARRAY",
          items: {
            type: "OBJECT",
            properties: {
              tone: { type: "STRING" },
              english: { type: "STRING" },
              korean: { type: "STRING" },
              pronunciation_tip: { type: "STRING" }
            },
            required: ["tone", "english", "korean", "pronunciation_tip"]
          }
        },
        key_words: {
          type: "ARRAY",
          items: {
            type: "OBJECT",
            properties: {
              word: { type: "STRING" },
              meaning: { type: "STRING" },
              is_ngsl_721: { type: "BOOLEAN" }
            },
            required: ["word", "meaning", "is_ngsl_721"]
          }
        },
        child_responses: {
          type: "ARRAY",
          items: {
            type: "OBJECT",
            properties: {
              type: { type: "STRING" },
              child_english: { type: "STRING" },
              child_korean: { type: "STRING" },
              parent_reply_en: { type: "STRING" },
              parent_reply_ko: { type: "STRING" }
            },
            required: ["type", "child_english", "child_korean", "parent_reply_en", "parent_reply_ko"]
          }
        }
      },
      required: ["situation_summary", "parent_expressions", "key_words", "child_responses"]
    };

    // 초기 실행: URL 해시(#key=...)로 공유받은 키 자동 등록
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#key=')) {
        const sharedKey = decodeURIComponent(hash.replace('#key=', '')).trim();
        if (sharedKey) {
          localStorage.setItem(STORAGE_KEY, sharedKey);
          history.replaceState(null, '', window.location.pathname + window.location.search);
          showToast('배우자가 공유한 API 키가 자동 등록되었습니다!');
        }
      }

      const savedKey = localStorage.getItem(STORAGE_KEY);
      if (!savedKey) {
        toggleModal(true);
      } else {
        document.getElementById('apiKeyInput').value = savedKey;
      }
    });

    function toggleModal(show) {
      const modal = document.getElementById('apiModal');
      if (show) {
        document.getElementById('apiKeyInput').value = localStorage.getItem(STORAGE_KEY) || '';
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (!val) {
        showToast('API 키를 입력해 주세요.');
        return;
      }
      localStorage.setItem(STORAGE_KEY, val);
      toggleModal(false);
      showToast('API 키가 저장되었습니다.');
    }

    async function shareApiKey() {
      const savedKey = localStorage.getItem(STORAGE_KEY);
      if (!savedKey) {
        showToast('먼저 [키 설정]에서 API 키를 저장해 주세요.');
        toggleModal(true);
        return;
      }
      const shareUrl = `${window.location.origin}${window.location.pathname}#key=${encodeURIComponent(savedKey)}`;
      try {
        await navigator.clipboard.writeText(shareUrl);
        showToast('전용 공유 링크가 복사되었습니다! 카톡으로 보내주세요.');
      } catch {
        prompt('아래 링크를 복사해서 배우자에게 보내주세요:', shareUrl);
      }
    }

    function quickFill(text) {
      document.getElementById('situationInput').value = text;
      generateExpressions();
    }

    function speakText(text, rate = 1.0) {
      if (!('speechSynthesis' in window)) {
        showToast('이 브라우저에서는 음성 듣기를 지원하지 않습니다.');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('이 브라우저에서는 음성 인식을 지원하지 않습니다.');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.interimResults = false;

      const micLabel = document.getElementById('micLabel');
      micLabel.textContent = '듣는 중...';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('situationInput').value = transcript;
        micLabel.textContent = '말로 입력';
        generateExpressions();
      };

      recognition.onerror = () => {
        micLabel.textContent = '말로 입력';
        showToast('음성을 인식하지 못했습니다. 다시 시도해 주세요.');
      };

      recognition.onend = () => {
        micLabel.textContent = '말로 입력';
      };

      recognition.start();
    }

    async function generateExpressions() {
      const apiKey = localStorage.getItem(STORAGE_KEY);
      if (!apiKey) {
        toggleModal(true);
        showToast('먼저 Gemini API 키를 설정해 주세요.');
        return;
      }

      const userText = document.getElementById('situationInput').value.trim();
      if (!userText) {
        showToast('아이에게 하고 싶은 말을 입력해 주세요.');
        return;
      }

      const btn = document.getElementById('generateBtn');
      const loadingBox = document.getElementById('loadingBox');
      const errorBox = document.getElementById('errorBox');
      const resultArea = document.getElementById('resultArea');

      btn.disabled = true;
      btn.classList.add('opacity-60');
      loadingBox.classList.remove('hidden');
      errorBox.classList.add('hidden');
      resultArea.classList.add('hidden');

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: SYSTEM_INSTRUCTION }]
            },
            contents: [
              { role: "user", parts: [{ text: userText }] }
            ],
            generationConfig: {
              temperature: 0.7,
              responseMimeType: "application/json",
              responseSchema: RESPONSE_SCHEMA
            }
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || 'API 호출 중 오류가 발생했습니다.');
        }

        const rawJsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawJsonText) throw new Error('응답 데이터를 해석할 수 없습니다.');

        const parsed = JSON.parse(rawJsonText);
        renderResult(parsed);
      } catch (err) {
        errorBox.textContent = `오류: ${err.message} (API 키가 올바른지 확인해 주세요.)`;
        errorBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-60');
        loadingBox.classList.add('hidden');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderResult(data) {
      document.getElementById('situationSummary').textContent = data.situation_summary;

      // 1. 부모 표현 카드
      const parentCards = document.getElementById('parentCards');
      parentCards.innerHTML = data.parent_expressions.map(item => `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">${escapeHtml(item.tone)}</span>
            <div class="flex gap-1.5">
              <button onclick="speakText('${escapeHtml(item.english)}', 1.0)" class="text-xs bg-slate-100 hover:bg-indigo-100 text-slate-700 px-2.5 py-1 rounded-lg font-medium">🔊 1.0x</button>
              <button onclick="speakText('${escapeHtml(item.english)}', 0.8)" class="text-xs bg-slate-100 hover:bg-indigo-100 text-slate-700 px-2.5 py-1 rounded-lg font-medium">🐢 0.8x</button>
            </div>
          </div>
          <p class="text-base font-bold text-slate-900 leading-snug">${escapeHtml(item.english)}</p>
          <p class="text-xs text-slate-600">${escapeHtml(item.korean)}</p>
          <p class="text-[11px] text-amber-700 bg-amber-50/80 rounded-lg px-2.5 py-1.5">💡 ${escapeHtml(item.pronunciation_tip)}</p>
        </div>
      `).join('');

      // 2. 핵심 단어 칩
      const wordChips = document.getElementById('wordChips');
      wordChips.innerHTML = data.key_words.map(w => `
        <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
          <span class="text-xs font-bold text-slate-900">${escapeHtml(w.word)}</span>
          <span class="text-xs text-slate-600">${escapeHtml(w.meaning)}</span>
          ${w.is_ngsl_721 ? '<span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">721</span>' : ''}
        </div>
      `).join('');

      // 3. 아이 예상 답변 카드
      const childCards = document.getElementById('childCards');
      childCards.innerHTML = data.child_responses.map(c => `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-full">${escapeHtml(c.type)}</span>
              <button onclick="speakText('${escapeHtml(c.child_english)}', 0.95)" class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-medium">🔊 아이 발음</button>
            </div>
            <p class="text-sm font-bold text-slate-900">"${escapeHtml(c.child_english)}"</p>
            <p class="text-xs text-slate-500">${escapeHtml(c.child_korean)}</p>
          </div>

          <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-1">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-indigo-600">↳ 부모 후속 반응</span>
              <button onclick="speakText('${escapeHtml(c.parent_reply_en)}', 0.95)" class="text-[11px] text-indigo-700 font-semibold">🔊 듣기</button>
            </div>
            <p class="text-xs font-bold text-slate-800">${escapeHtml(c.parent_reply_en)}</p>
            <p class="text-[11px] text-slate-500">${escapeHtml(c.parent_reply_ko)}</p>
          </div>
        </div>
      `).join('');

      document.getElementById('resultArea').classList.remove('hidden');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2800);
    }
  </script>
</body>
</html>
